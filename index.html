<script>
/* =========================================================
   App marca blanca – catálogo, promociones y venta
   Modo "local": datos en el navegador (demo).
   Modo "api":   si existe api.php en el mismo servidor, los datos
                 se guardan en el hosting y se comparten entre equipos.
   ========================================================= */
const MAX_PROD = 20, MAX_PROMO = 10;
const ESTADOS = ['Nuevo','Confirmado','Pagado','En camino','Entregado','Cancelado'];
const PAGOS = ['Yape','Plin','Transferencia','Tarjeta','Contra entrega'];
const REDES = ['facebook','instagram','tiktok','youtube','x','linkedin'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n + Number.EPSILON) * 100) / 100;
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toUpperCase();

/* ---------- almacenamiento seguro ---------- */
const MEM = {};
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in MEM ? MEM[k] : d); } catch (e) { return k in MEM ? MEM[k] : d; } },
  set(k, v) { MEM[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};

/* ---------- fechas y dinero ---------- */
function isoDia(offset = 0) { const d = new Date(); d.setDate(d.getDate() + offset); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
const hoy = () => isoDia(0);
function money(n) { return (EMP?.moneda || 'S/') + ' ' + (+n).toLocaleString('es-PE', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fechaTxt(iso) { if (!iso) return ''; const d = new Date(iso.length === 10 ? iso + 'T12:00' : iso); return d.toLocaleDateString('es-PE', {day: '2-digit', month: 'short', year: 'numeric'}); }
function fechaHora(iso) { const d = new Date(iso); return d.toLocaleDateString('es-PE', {day: '2-digit', month: 'short'}) + ' ' + d.toLocaleTimeString('es-PE', {hour: '2-digit', minute: '2-digit'}); }

/* ---------- datos de ejemplo ---------- */
function seed() {
  const P = [
    ['Montura de acetato clásica','Monturas','producto',189,'👓',15,'Acetato de alta resistencia, diseño clásico unisex. Incluye estuche y paño. Puedes agregarle lunas con tu medida.'],
    ['Montura metálica ultraliviana','Monturas','producto',229,'👓',12,'Titanio y acero inoxidable, plaquetas ajustables y bisagras flexibles para uso diario.'],
    ['Montura al aire (sin aro)','Monturas','producto',289,'👓',8,'Diseño minimalista sin aro, muy liviana y elegante. Ideal con lunas antirreflejo.'],
    ['Montura infantil flexible','Monturas','producto',149,'👓',14,'Material flexible y resistente a golpes, con varillas ajustables para niños de 4 a 12 años.'],
    ['Montura deportiva','Monturas','producto',199,'🥽',10,'Ajuste envolvente y antideslizante para deporte, con opción de lunas graduadas.'],
    ['Lentes de sol polarizados','Lentes de sol','producto',249,'🕶️',12,'Polarizados con protección UV400. Reducen los reflejos al manejar o en la playa.'],
    ['Lentes de sol tipo aviador','Lentes de sol','producto',219,'🕶️',10,'Estilo aviador metálico con protección UV400 total.'],
    ['Lentes de sol graduados','Lentes de sol','producto',399,'🕶️',6,'Lentes de sol con tu medida y protección UV400. Envíanos tu receta por WhatsApp.'],
    ['Lunas monofocales antirreflejo','Lunas','producto',159,'🔍',30,'Par de lunas con tu medida y tratamiento antirreflejo. Envíanos tu receta o agenda tu examen visual.'],
    ['Lunas con filtro de luz azul','Lunas','producto',199,'💻',30,'Par de lunas antirreflejo con filtro de luz azul. Ideales para computadora y celular.'],
    ['Lunas fotocromáticas','Lunas','producto',289,'🌗',20,'Se oscurecen con el sol y se aclaran en interiores. Par con tu medida.'],
    ['Lunas progresivas','Lunas','producto',590,'👁️',15,'Visión de lejos, intermedia y de cerca en una sola luna. Par con tu medida.'],
    ['Lentes de contacto mensuales (caja x6)','Lentes de contacto','producto',120,'👁️',25,'Lentes blandos de reemplazo mensual. Indica tu medida al hacer el pedido.'],
    ['Lentes de contacto de color (par)','Lentes de contacto','producto',95,'🎨',20,'Varios tonos disponibles, con o sin medida. Uso hasta 3 meses.'],
    ['Solución multipropósito 360 ml','Lentes de contacto','producto',39,'🧴',40,'Limpia, desinfecta y conserva tus lentes de contacto. Incluye estuche.'],
    ['Estuche rígido + paño de microfibra','Accesorios','producto',25,'💼',50,'Protege tus lentes de golpes y rayones.'],
    ['Examen visual computarizado','Servicios','servicio',40,'🩺',null,'Medición computarizada y evaluación con optometrista. Reserva tu cita y elige la fecha.'],
    ['Adaptación de lentes de contacto','Servicios','servicio',60,'🧑‍⚕️',null,'Evaluación, prueba y enseñanza de colocación y cuidado de lentes de contacto.'],
    ['Ajuste y mantenimiento de lentes','Servicios','servicio',20,'🔧',null,'Ajuste de varillas y plaquetas, limpieza ultrasónica y cambio de tornillos.'],
    ['Reparación de monturas','Servicios','servicio',45,'🛠️',null,'Soldadura, cambio de bisagras y repuestos. Te confirmamos el diagnóstico por WhatsApp.']
  ];
  const productos = P.map((a, i) => ({id: 'p' + (i + 1), nombre: a[0], categoria: a[1], tipo: a[2], precio: a[3], emoji: a[4], stock: a[5], descripcion: a[6], img: '', activo: true}));
  const R = [
    ['Montura clásica -20%',1,20,30,'Tu montura de acetato con 20% de descuento.'],

    ['Progresivas a tu medida',12,15,40,'Lunas progresivas con 15% de descuento.'],
    ['Fotocromáticas',11,20,30,'Lunas que se adaptan a la luz con 20% de descuento.'],
    ['Vuelta al cole',4,20,60,'Monturas infantiles con 20% de descuento.'],
    ['Pack contacto',13,15,30,'Caja de lentes de contacto mensuales con 15% de descuento.'],
    ['Examen visual a mitad de precio',17,50,20,'Tu examen visual computarizado al 50%.'],
    ['Cambia tu look',14,20,30,'Lentes de contacto de color con 20% de descuento.'],
    ['Solución -25%',15,25,30,'Solución multipropósito con 25% de descuento.']
  ];
  const promos = R.map((a, i) => ({id: 'pr' + (i + 1), titulo: a[0], productoId: 'p' + a[1], descuento: a[2], inicio: isoDia(-10), fin: isoDia(a[3]), descripcion: a[4], activa: true}));
  return {version: 1, adminPin: '1234', empresas: [empresaBase({id: 'e1', slug: 'opticachacarilla', codigo: 'OC', nombre: 'Óptica Chacarilla', eslogan: 'Cuidamos tu visión con estilo', color: '#1E3A8A',
    whatsapp: '51999999999', telefono: '', email: 'ventas@opticachacarilla.com', direccion: 'Chacarilla, Santiago de Surco, Lima', horario: 'Lun a Sáb de 10:00 a 20:00',
    redes: {facebook: 'opticachacarilla', instagram: 'opticachacarilla', tiktok: 'opticachacarilla', youtube: '', x: '', linkedin: ''}, envio: {costo: 10, gratisDesde: 250}, productos, promos})], pedidos: []};
}
function empresaBase(o = {}) {
  return Object.assign({id: 'e' + uid(), slug: '', codigo: 'EM', nombre: 'Nueva empresa', eslogan: '', logo: '', color: '#1D4ED8', moneda: 'S/', whatsapp: '', telefono: '', email: '', direccion: '', horario: '',
    redes: {facebook: '', instagram: '', tiktok: '', youtube: '', x: '', linkedin: ''}, envio: {costo: 10, gratisDesde: 300}, pagos: PAGOS.slice(), productos: [], promos: []}, o);
}

/* ---------- reglas de precio (iguales en api.php) ---------- */
function promoActiva(p) { const h = hoy(); return !!p.activa && (!p.inicio || p.inicio <= h) && (!p.fin || p.fin >= h); }
function promoDe(emp, pid) { return emp.promos.filter(p => p.productoId === pid && promoActiva(p)).sort((a, b) => b.descuento - a.descuento)[0] || null; }
function precioFinal(emp, prod) { const pr = promoDe(emp, prod.id); return pr ? r2(prod.precio * (1 - pr.descuento / 100)) : prod.precio; }
function calcular(emp, items, entrega) {
  let subtotal = 0, descuento = 0; const lineas = [];
  for (const it of items) {
    const p = emp.productos.find(x => x.id === it.id && x.activo); if (!p) continue;
    const pf = precioFinal(emp, p);
    subtotal += p.precio * it.cant; descuento += (p.precio - pf) * it.cant;
    lineas.push({id: p.id, nombre: p.nombre, tipo: p.tipo, precio: p.precio, precioFinal: pf, cant: it.cant});
  }
  subtotal = r2(subtotal); descuento = r2(descuento);
  const neto = r2(subtotal - descuento);
  let envio = 0;
  if (entrega === 'delivery' && lineas.some(l => l.tipo === 'producto')) envio = neto >= +emp.envio.gratisDesde ? 0 : +emp.envio.costo;
  return {lineas, subtotal, descuento, envio: r2(envio), total: r2(neto + envio)};
}

/* ---------- capa de datos ---------- */
let DB, EMP, MODE = 'local';
const STOCK_EDIT = new Set();
const ADMIN = {on: false, pin: '', tab: 'resumen', pedidos: []};
const UI = {cat: 'Todas', q: '', tipo: 'todos'};

async function api(action, body, extra = '') {
  const r = await fetch('api.php?action=' + action + extra, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
async function cargarDB() {
  try {
    if (location.protocol.startsWith('http')) {
      const r = await fetch('api.php?action=load', {cache: 'no-store'});
      const ct = r.headers.get('content-type') || '';
      if (r.ok && ct.includes('json')) {
        const j = await r.json(); MODE = 'api';
        if (j.empresas) return j;
        // Primera instalación: el servidor está vacío → se cargan los datos de ejemplo
        const s = seed(); delete s.adminPin; delete s.pedidos;
        await api('init', {db: s}); return Object.assign(s, {pedidos: []});
      }
    }
  } catch (e) {}
  MODE = 'local';
  return LS.get('wl_db', null) || seed();
}
async function guardarDB() {
  if (MODE === 'api') {
    // Conserva el stock real del servidor (pudo bajar por ventas) salvo en productos cuyo stock editó el admin

  };
  let primero = null;
  for (const [k, bad] of Object.entries(errores)) { const el = f.elements[k]; if (el && el.classList) { el.classList.toggle('bad', !!bad); if (bad && !primero) primero = el; } }
  $('#err-ok').style.display = v.acepto ? 'none' : 'block';
  if (primero) { primero.focus(); toast('Revisa los campos marcados'); return null; }
  if (!v.acepto) { toast('Debes aceptar para continuar'); return null; }
  return {nombre: v.nombre.trim(), telefono: v.telefono.replace(/\D/g, ''), email: (v.email || '').trim(), entrega: v.entrega || 'servicio', direccion: necesitaDir ? v.direccion.trim() : '', fechaServicio: hayServ ? v.fechaServicio : '', pago: v.pago, nota: (v.nota || '').trim()};
}
async function crearPedido(cliente) {
  const items = getCart();
  let pedido;
  if (MODE === 'api') {
    pedido = (await api('order', {empresaId: EMP.id, items, cliente})).pedido;
    // refrescar stock local
    const fresh = await api('load'); if (fresh.empresas) { DB.empresas = fresh.empresas; EMP = DB.empresas.find(e => e.id === EMP.id) || EMP; }
  } else {
    const t = calcular(EMP, items, cliente.entrega);
    if (!t.lineas.length) throw new Error('El carrito está vacío');
    for (const l of t.lineas) { const p = EMP.productos.find(x => x.id === l.id); if (p.tipo === 'producto' && p.stock < l.cant) throw new Error(`Stock insuficiente de ${p.nombre} (quedan ${p.stock})`); }
    for (const l of t.lineas) { const p = EMP.productos.find(x => x.id === l.id); if (p.tipo === 'producto') p.stock -= l.cant; }
    const n = DB.pedidos.filter(x => x.empresaId === EMP.id).length + 1;
    pedido = {id: uid(), num: (EMP.codigo || 'PD') + '-' + String(n).padStart(4, '0'), empresaId: EMP.id, fecha: new Date().toISOString(), cliente, ...t, estado: 'Nuevo', historial: [{estado: 'Nuevo', fecha: new Date().toISOString()}]};
    DB.pedidos.unshift(pedido); await guardarDB();
  }
  const mis = LS.get('wl_mis', []); mis.unshift({id: pedido.id, empresaId: EMP.id}); LS.set('wl_mis', mis.slice(0, 50));
  LS.set('wl_cliente', {nombre: cliente.nombre, telefono: cliente.telefono, email: cliente.email, direccion: cliente.direccion});
  LS.set('wl_ult_' + pedido.id, pedido);
  setCart([]);
  return pedido;
}
function mensajePedido(p) {
  const L = [`*Nuevo pedido ${p.num}* – ${EMP.nombre}`, '', `👤 ${p.cliente.nombre}`, `📱 ${p.cliente.telefono}`];
  if (p.cliente.entrega === 'delivery') L.push(`🚚 Delivery: ${p.cliente.direccion}`); else if (p.cliente.entrega === 'recojo') L.push('🏬 Recojo en tienda');
  if (p.cliente.fechaServicio) L.push(`📅 Servicio: ${fechaTxt(p.cliente.fechaServicio)}${p.cliente.entrega !== 'delivery' ? ' – ' + p.cliente.direccion : ''}`);
  L.push(`💳 Pago: ${p.cliente.pago}`, '', '*Detalle*');
  p.lineas.forEach(l => L.push(`• ${l.cant} x ${l.nombre} – ${money(l.precioFinal * l.cant)}`));
  L.push('', `Subtotal: ${money(p.subtotal)}`);
  if (p.descuento) L.push(`Descuentos: -${money(p.descuento)}`);
  if (p.cliente.entrega === 'delivery') L.push(`Envío: ${p.envio ? money(p.envio) : 'Gratis'}`);
  L.push(`*TOTAL: ${money(p.total)}*`);
  if (p.cliente.nota) L.push('', `Nota: ${p.cliente.nota}`);
  return L.join('\n');
}

    <div><label class="f">Categoría *</label><input class="in" name="categoria" list="dl-cat" value="${esc(p.categoria)}"><datalist id="dl-cat">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist><div class="err">Obligatoria.</div></div></div>
    <div class="two"><div><label class="f">Precio (S/) *</label><input class="in" name="precio" type="number" min="0" step="0.1" value="${p.precio}"><div class="err">Mayor a 0.</div></div>
    <div id="stockbox"><label class="f">Stock *</label><input class="in" name="stock" type="number" min="0" step="1" value="${p.stock ?? 0}"><div class="err">Entero, 0 o más.</div></div></div>
    <label class="f">Ícono si no hay foto</label><input class="in" name="emoji" value="${esc(p.emoji)}" maxlength="4" style="width:90px">
    <label class="f">Descripción</label><textarea class="in" name="descripcion" rows="3" maxlength="400">${esc(p.descripcion)}</textarea>
    <label class="row small" style="margin-top:10px"><input type="checkbox" name="activo" ${p.activo ? 'checked' : ''}> Visible en la app</label>
    <div class="row" style="margin-top:14px"><button type="button" class="btn ghost full" data-act="closeModal">Cancelar</button><button class="btn full">Guardar</button></div>
    ${id ? '<button type="button" class="btn danger full" style="margin-top:8px" data-act="delProd" data-id="' + p.id + '">Eliminar</button>' : ''}</form>`);
  const f = $('form[data-form=producto]'); const sync = () => $('#stockbox').style.visibility = f.tipo.value === 'servicio' ? 'hidden' : ''; f.tipo.onchange = sync; sync();
}
function modalPromo(id) {
  const pr = EMP.promos.find(x => x.id === id) || {id: '', titulo: '', productoId: EMP.productos[0]?.id, descuento: 10, inicio: hoy(), fin: isoDia(30), descripcion: '', activa: true};
  modal(`<h3>${id ? 'Editar' : 'Nueva'} promoción</h3><form data-form="promo" data-id="${pr.id}" novalidate>
    <label class="f">Título *</label><input class="in" name="titulo" value="${esc(pr.titulo)}" maxlength="40"><div class="err">Obligatorio.</div>
    <label class="f">Producto o servicio *</label><select class="in" name="productoId">${EMP.productos.map(p => `<option value="${p.id}" ${p.id === pr.productoId ? 'selected' : ''}>${esc(p.nombre)} – ${money(p.precio)}</option>`).join('')}</select>
    <label class="f">Descuento (%) *</label><input class="in" name="descuento" type="number" min="1" max="90" value="${pr.descuento}"><div class="err">Entre 1 y 90.</div>
    <div class="two"><div><label class="f">Desde *</label><input class="in" type="date" name="inicio" value="${pr.inicio}"><div class="err">Obligatorio.</div></div><div><label class="f">Hasta *</label><input class="in" type="date" name="fin" value="${pr.fin}"><div class="err">Debe ser igual o posterior al inicio.</div></div></div>
    <label class="f">Descripción</label><input class="in" name="descripcion" value="${esc(pr.descripcion)}" maxlength="120">
    <label class="row small" style="margin-top:10px"><input type="checkbox" name="activa" ${pr.activa ? 'checked' : ''}> Promoción activa</label>
    <div class="row" style="margin-top:14px"><button type="button" class="btn ghost full" data-act="closeModal">Cancelar</button><button class="btn full">Guardar</button></div>
    ${id ? '<button type="button" class="btn danger full" style="margin-top:8px" data-act="delPromo" data-id="' + pr.id + '">Eliminar</button>' : ''}</form>`);
}
let TMP_IMG = '';
function leerImagen(file, max) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Archivo no es una imagen'));
    if (file.size > 8e6) return rej(new Error('La imagen supera 8 MB'));
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .82)); }; im.onerror = () => rej(new Error('No se pudo leer la imagen')); im.src = fr.result; };
    fr.onerror = () => rej(new Error('No se pudo leer el archivo')); fr.readAsDataURL(file);
  });
}
const marcar = (f, campo, mal) => { const el = f.elements[campo]; if (el) el.classList.toggle('bad', !!mal); return !!mal; };

/* ---------- formularios ---------- */
const FORMS = {
  async login(f) {
    const pin = f.pin.value.trim();
    try {
      const ok = MODE === 'api' ? (await api('login', {pin})).ok : pin === String(DB.adminPin || '1234');
      if (!ok) return toast('PIN incorrecto');
      ADMIN.on = true; ADMIN.pin = pin; await cargarPedidosAdmin(); ADMIN.tab = 'resumen'; render();
    } catch (e) { toast(e.message); }
  },
  async checkout(f) {
    const cliente = validarCheckout(f); if (!cliente) return;
    const b = $('#btn-confirmar'); b.disabled = true; b.textContent = 'Registrando…';
    try { const p = await crearPedido(cliente); location.hash = 'ok-' + p.id; }
    catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Confirmar pedido'; }
  },
  async empresa(f) {
    const v = k => (f.elements[k]?.value || '').trim();
    const wa = v('whatsapp').replace(/\D/g, ''), slug = v('slug').toLowerCase();
    let bad = false;
    bad = marcar(f, 'nombre', v('nombre').length < 2) || bad;
    bad = marcar(f, 'codigo', !/^[A-Za-z]{2,4}$/.test(v('codigo'))) || bad;
    bad = marcar(f, 'slug', !/^[a-z0-9-]{2,40}$/.test(slug) || DB.empresas.some(e => e.slug === slug && e.id !== EMP.id)) || bad;
    bad = marcar(f, 'whatsapp', !/^\d{11,13}$/.test(wa)) || bad;
    bad = marcar(f, 'email', v('email') && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))) || bad;
    if (bad) return toast('Revisa los campos marcados');
    Object.assign(EMP, {nombre: v('nombre'), eslogan: v('eslogan'), codigo: v('codigo').toUpperCase(), color: v('color'), slug, whatsapp: wa, telefono: v('telefono'), email: v('email'), direccion: v('direccion'), horario: v('horario'),
      envio: {costo: Math.max(0, +v('envioCosto') || 0), gratisDesde: Math.max(0, +v('envioGratis') || 0)}, pagos: [...f.querySelectorAll('input[name=pagos]:checked')].map(x => x.value)});
    if (!EMP.pagos.length) EMP.pagos = ['Contra entrega'];
    REDES.forEach(r => EMP.redes[r] = v('red_' + r));
    if (MODE === 'local' && v('pin')) { if (!/^\d{4,8}$/.test(v('pin'))) return toast('El PIN debe tener de 4 a 8 dígitos'); DB.adminPin = v('pin'); }
    await guardarSeguro('Datos de la empresa guardados ✓'); aplicarTema(); render();
  },
  async producto(f) {
    const id = f.dataset.id, v = k => (f.elements[k]?.value || '').trim();
    if (!id && EMP.productos.length >= MAX_PROD) return toast(`Límite de ${MAX_PROD} productos alcanzado`);
    const tipo = v('tipo'); let bad = false;
    bad = marcar(f, 'nombre', v('nombre').length < 3) || bad;
    bad = marcar(f, 'categoria', !v('categoria')) || bad;
    bad = marcar(f, 'precio', !(+v('precio') > 0)) || bad;
    bad = marcar(f, 'stock', tipo === 'producto' && !(/^\d+$/.test(v('stock')))) || bad;
    if (bad) return toast('Revisa los campos marcados');
    const data = {nombre: v('nombre'), categoria: v('categoria'), tipo, precio: r2(+v('precio')), stock: tipo === 'producto' ? parseInt(v('stock'), 10) : null, emoji: v('emoji') || '📦', descripcion: v('descripcion'), img: TMP_IMG || '', activo: f.activo.checked};
    if (id) { const cur = EMP.productos.find(p => p.id === id); if (cur.stock !== data.stock) STOCK_EDIT.add(id); Object.assign(cur, data); } else EMP.productos.push({id: 'p' + uid(), ...data});
    modal(''); await guardarSeguro('Producto guardado ✓'); render();
  },
  async promo(f) {
    const id = f.dataset.id, v = k => (f.elements[k]?.value || '').trim();
    if (!id && EMP.promos.length >= MAX_PROMO) return toast(`Límite de ${MAX_PROMO} promociones alcanzado`);
    let bad = false; const d = +v('descuento');
    bad = marcar(f, 'titulo', !v('titulo')) || bad;
    bad = marcar(f, 'descuento', !(d >= 1 && d <= 90)) || bad;
    bad = marcar(f, 'inicio', !v('inicio')) || bad;
    bad = marcar(f, 'fin', !v('fin') || v('fin') < v('inicio')) || bad;
    if (bad) return toast('Revisa los campos marcados');
    const data = {titulo: v('titulo'), productoId: v('productoId'), descuento: Math.round(d), inicio: v('inicio'), fin: v('fin'), descripcion: v('descripcion'), activa: f.activa.checked};
    if (id) Object.assign(EMP.promos.find(p => p.id === id), data); else EMP.promos.push({id: 'pr' + uid(), ...data});
    modal(''); await guardarSeguro('Promoción guardada ✓'); render();
  }
};
async function guardarSeguro(msg) { try { await guardarDB(); toast(msg); } catch (e) { toast('No se guardó: ' + e.message); } }
async function cargarPedidosAdmin() { if (MODE === 'api' && ADMIN.on) { try { ADMIN.pedidos = (await api('orders', {pin: ADMIN.pin})).pedidos || []; } catch (e) { toast(e.message); } } }

/* ---------- acciones ---------- */
const ACT = {
  add: b => agregar(b.dataset.id, 1),
  qty: b => { const s = $('#qtyv'); const max = +($('[data-act=qty][data-d="1"]').dataset.max || 99); QTY = Math.min(Math.max(1, QTY + +b.dataset.d), Math.max(1, max)); s.textContent = QTY; },
  addQty: b => { if (agregar(b.dataset.id, QTY)) setTimeout(() => location.hash = 'carrito', 350); },
  inc: b => { agregar(b.dataset.id, 1); render(); },
  dec: b => { const c = getCart(), it = c.find(x => x.id === b.dataset.id); if (it) { it.cant--; setCart(c.filter(x => x.cant > 0)); } render(); },
  rm: b => { setCart(getCart().filter(x => x.id !== b.dataset.id)); toast('Quitado del carrito'); render(); },
  cat: b => { UI.cat = b.dataset.v; document.querySelectorAll('[data-act=cat]').forEach(x => x.classList.toggle('on', x === b)); pintarGrid(); },
  tipo: b => { UI.tipo = b.dataset.v; document.querySelectorAll('[data-act=tipo]').forEach(x => x.classList.toggle('on', x === b)); pintarGrid(); },
  copyMsg: b => { const p = (DB.pedidos || []).find(x => x.id === b.dataset.id) || LS.get('wl_ult_' + b.dataset.id); if (p) copiar(mensajePedido(p)); },
  reload: async () => { if (MODE === 'api') { try { const j = await api('load'); if (j.empresas) { DB.empresas = j.empresas; EMP = DB.empresas.find(e => e.id === EMP.id) || DB.empresas[0]; } } catch (e) {} await cargarPedidosAdmin(); } render(); toast('Actualizado'); },
  closeModal: () => modal(''),
  closeModalBg: (b, e) => { if (e.target === b) modal(''); },
  admTab: async b => { ADMIN.tab = b.dataset.v; if (ADMIN.tab === 'pedidos' || ADMIN.tab === 'resumen') await cargarPedidosAdmin(); render(); },
  logout: () => { ADMIN.on = false; ADMIN.pin = ''; render(); },
  verTienda: () => LS.set('wl_emp', EMP.id),
  editProd: b => modalProducto(b.dataset.id),
  editPromo: b => modalPromo(b.dataset.id),
  rmProdImg: () => { TMP_IMG = ''; $('#pimg').innerHTML = '<span>📦</span>'; },
  rmLogo: async () => { EMP.logo = ''; await guardarSeguro('Logo eliminado'); render(); },
  delProd: b => confirmar('¿Eliminar este producto? También se eliminarán sus promociones.', async () => { EMP.productos = EMP.productos.filter(p => p.id !== b.dataset.id); EMP.promos = EMP.promos.filter(p => p.productoId !== b.dataset.id); await guardarSeguro('Producto eliminado'); render(); }),
  delPromo: b => confirmar('¿Eliminar esta promoción?', async () => { EMP.promos = EMP.promos.filter(p => p.id !== b.dataset.id); await guardarSeguro('Promoción eliminada'); render(); }),
  newEmp: async () => { const e = empresaBase(); e.slug = 'empresa-' + (DB.empresas.length + 1); DB.empresas.push(e); EMP = e; LS.set('wl_emp', e.id); ADMIN.tab = 'empresa'; aplicarTema(); await guardarSeguro('Empresa creada: completa sus datos'); render(); },
  delEmp: () => confirmar(`¿Eliminar la empresa "${EMP.nombre}" con su catálogo?`, async () => { DB.empresas = DB.empresas.filter(e => e.id !== EMP.id); EMP = DB.empresas[0]; LS.set('wl_emp', EMP.id); aplicarTema(); ADMIN.tab = 'resumen'; await guardarSeguro('Empresa eliminada'); render(); })
};
const CHANGE = {
  async estado(el) {
    const id = el.dataset.id, estado = el.value;
    try {
      if (MODE === 'api') { await api('setStatus', {pin: ADMIN.pin, id, estado}); await cargarPedidosAdmin(); const j = await api('load'); if (j.empresas) { DB.empresas = j.empresas; EMP = DB.empresas.find(e => e.id === EMP.id); } }
      else {
        const p = DB.pedidos.find(x => x.id === id);
        if (estado === 'Cancelado' && p.estado !== 'Cancelado') p.lineas.forEach(l => { const pr = EMP.productos.find(x => x.id === l.id); if (pr && pr.tipo === 'producto') pr.stock += l.cant; });
        if (p.estado === 'Cancelado' && estado !== 'Cancelado') { for (const l of p.lineas) { const pr = EMP.productos.find(x => x.id === l.id); if (pr && pr.tipo === 'producto' && pr.stock < l.cant) { toast('No hay stock para reactivar el pedido'); el.value = p.estado; return; } } p.lineas.forEach(l => { const pr = EMP.productos.find(x => x.id === l.id); if (pr && pr.tipo === 'producto') pr.stock -= l.cant; }); }
        p.estado = estado; (p.historial = p.historial || []).push({estado, fecha: new Date().toISOString()}); await guardarDB();
      }
      toast('Estado actualizado: ' + estado); render();
    } catch (e) { toast(e.message); }
  },
  empresa(el) { EMP = DB.empresas.find(e => e.id === el.value); LS.set('wl_emp', EMP.id); aplicarTema(); render(); },
  async logo(el) { try { EMP.logo = await leerImagen(el.files[0], 256); await guardarSeguro('Logo actualizado ✓'); render(); } catch (e) { toast(e.message); } },
  async prodImg(el) { try { TMP_IMG = await leerImagen(el.files[0], 600); $('#pimg').innerHTML = `<img src="${TMP_IMG}" alt="">`; } catch (e) { toast(e.message); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { if (b.tagName === 'BUTTON') e.preventDefault(); ACT[b.dataset.act](b, e); } });
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; FORMS[f.dataset.form]?.(f); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el); if (el.name === 'entrega') pintarTotales(); if (el.classList.contains('bad')) el.classList.remove('bad'); });
document.addEventListener('input', e => { if (e.target.id === 'q') { UI.q = e.target.value; pintarGrid(); } });

/* ---------- router ---------- */
async function render() {
  const h = (location.hash || '#inicio').slice(1);
  const i = h.indexOf('-'), v = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : h.slice(i + 1);
  const app = $('#app');
  let html;
  switch (v) {
    case 'catalogo': html = vCatalogo(); break;
    case 'promos': html = vPromos(); break;
    case 'producto': html = vProducto(arg); break;
    case 'carrito': html = vCarrito(); break;
    case 'checkout': html = vCheckout(); break;
    case 'ok': html = vPedidoOk(arg); break;
    case 'pedidos': html = await vPedidos(); break;
    case 'contacto': html = vContacto(); break;
    case 'admin': html = vAdmin(); break;
    default: html = vInicio();
  }
  if (html) app.innerHTML = html;
  if (v === 'catalogo') pintarGrid();
  if (v === 'checkout') pintarTotales();
}
let ultimaVista = '';
window.addEventListener('hashchange', () => { modal(''); render().then(() => { const v = location.hash; if (v !== ultimaVista) window.scrollTo(0, 0); ultimaVista = v; }); });

(async function init() {
  DB = await cargarDB();
  if (!DB.pedidos) DB.pedidos = [];
  elegirEmpresa();
  await render();
  if (MODE === 'api' && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
