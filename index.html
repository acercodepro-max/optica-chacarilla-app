<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Óptica Chacarilla</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--brand:#1E3A8A;--brand-ink:#fff;--brand-soft:#e6f2f1;--bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#667085;--line:#e4e7ec;--ok:#12805c;--warn:#b54708;--bad:#b42318;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#e8eaee;color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px;box-shadow:0 0 0 1px var(--line)}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--brand);overflow:hidden;flex:none;font-size:16px}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.xl{width:84px;height:84px;border-radius:20px;font-size:30px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.bname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bslogan{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartbtn{position:relative;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:20px}
.cnt[hidden]{display:none}
.cnt{position:absolute;top:-4px;right:-4px;background:#e11d48;color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
main{padding:14px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:17px;margin:20px 0 10px;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:13px;color:var(--brand);font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;font-size:11px;color:var(--muted)}
nav.bottom a .i{font-size:20px;line-height:1}
nav.bottom a.on{color:var(--brand);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;font-size:46px;background:linear-gradient(135deg,var(--brand-soft),#fff);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.big{aspect-ratio:16/11;font-size:88px;border-radius:var(--r);border:1px solid var(--line)}
.badge{position:absolute;top:8px;left:8px;background:#e11d48;color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px}
.tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:3px 7px;border-radius:999px}
.pbody{padding:10px}
.pname{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.price{margin:6px 0 8px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:16px;color:var(--brand)}.price s{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--brand-ink);cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#1f9d55;color:#fff}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c1bd}
.row{display:flex;gap:10px;align-items:center}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.hero{background:var(--brand);color:var(--brand-ink);margin:-14px -14px 0;padding:22px 16px 26px;text-align:center}
.hero h1{margin:12px 0 4px;font-size:22px}.hero p{margin:0;opacity:.9}
.hero .row{justify-content:center;margin-top:14px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -14px;padding-left:14px;padding-right:14px}
.hscroll>*{scroll-snap-align:start;flex:0 0 78%}
.promo{display:flex;gap:12px;padding:12px;align-items:center}
.promo .thumb{width:86px;flex:none;aspect-ratio:1;border-radius:12px;font-size:38px}
.promo .pt{font-weight:700}.promo .pd{font-size:13px;color:var(--muted);margin:2px 0 6px}
.off{display:inline-block;background:#fde8ec;color:#be123c;font-weight:800;font-size:12px;padding:2px 8px;border-radius:999px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.qty button{border:0;background:none;width:36px;height:36px;font-size:18px;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-weight:700}
.line{display:flex;gap:10px;padding:12px;align-items:center;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .thumb{width:58px;aspect-ratio:1;border-radius:10px;font-size:28px;flex:none}
.line .grow{flex:1;min-width:0}
.tot{padding:12px 14px}.tot .row{justify-content:space-between;padding:4px 0}
.tot .big{font-size:18px;font-weight:800;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.in:focus,.search:focus{outline:2px solid var(--brand);outline-offset:-1px}
.err{color:var(--bad);font-size:12px;margin-top:4px;display:none}
.in.bad{border-color:var(--bad)}.in.bad+.err{display:block}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.seg input:checked+span{font-weight:700;color:var(--brand)}
.social{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.social a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff}
.social svg{width:22px;height:22px;fill:currentColor}
.s-facebook{background:#1877f2}.s-instagram{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}.s-tiktok{background:#111}.s-youtube{background:#ff0000}.s-x{background:#000}.s-linkedin{background:#0a66c2}.s-whatsapp{background:#1f9d55}
.info{padding:4px 14px}.info .row{padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}.info .row:last-child{border:0}
.info .k{width:26px;flex:none;font-size:18px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2f6}
.st-Nuevo{background:#e0ecff;color:#1d4ed8}.st-Confirmado{background:#fff4d6;color:#a15c00}.st-Pagado{background:#e3f6ec;color:#12805c}.st-En{background:#efe7ff;color:#6d28d9}.st-Entregado{background:#12805c;color:#fff}.st-Cancelado{background:#fde8e8;color:#b42318}
.steps{display:flex;justify-content:space-between;margin:10px 0 4px;position:relative}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line);margin:0 2px}.steps i.on{background:var(--brand)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty .e{font-size:54px}
.ok-big{text-align:center;padding:18px 8px}.ok-big .e{font-size:58px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#16181d;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,25,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
.modal h3{margin:4px 0 6px;font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:0 14px 4px}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.adm-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.adm-item:last-child{border:0}.adm-item .thumb{width:46px;aspect-ratio:1;border-radius:10px;font-size:24px;flex:none}
.adm-item .grow{flex:1;min-width:0}.adm-item .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px}.kpi b{display:block;font-size:20px;margin-top:2px}
.limit{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#eef2f6}
.limit.full{background:#fde8e8;color:var(--bad)}
.demo-bar{background:#fff7e6;color:#7a4b00;font-size:12px;padding:7px 14px;text-align:center;border-bottom:1px solid #f5e0b3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.cartbtn{border:0;cursor:pointer;color:inherit;font:inherit;font-size:20px}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filtros .in{padding:9px 10px;font-size:13px}
.grp{font-weight:800;font-size:16px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grp span{font-size:11px;font-weight:700;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 8px}
.subgrp{font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 8px}
.psub{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.modal-bg.top{align-items:flex-start}.modal-bg.top .modal{border-radius:0 0 18px 18px;max-height:85vh}
.qsr .adm-item{border-bottom:1px solid var(--line)}
.ubi{display:grid;gap:8px}
.trats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.trats label{font-size:12.5px}
</style>
</head>

function normalizar(e) {
  e.productos = e.productos || []; e.promos = e.promos || [];
  e.productos.forEach((p, i) => {
    p.familia = p.familia || p.categoria || 'General'; p.categoria = p.familia;

/* ---------- reglas de precio (iguales en api.php) ---------- */
function promoActiva(p) { const h = hoy(); return !!p.activa && (!p.inicio || p.inicio <= h) && (!p.fin || p.fin >= h); }
function promoDe(emp, pid) { return emp.promos.filter(p => p.productoId === pid && promoActiva(p)).sort((a, b) => b.descuento - a.descuento)[0] || null; }
function precioFinal(emp, prod) { const pr = promoDe(emp, prod.id); return pr ? r2(prod.precio * (1 - pr.descuento / 100)) : prod.precio; }
function calcular(emp, items, entrega) {
  let subtotal = 0, descuento = 0; const lineas = [];
  for (const it of items) {
    const p = emp.productos.find(x => x.id === it.id && x.activo); if (!p) continue;
    const pf = precioFinal(emp, p);
    subtotal += p.precio * it.cant; descuento += (p.precio - pf) * it.cant;
    lineas.push({id: p.id, nombre: p.nombre, tipo: p.tipo, precio: p.precio, precioFinal: pf, cant: it.cant});
  }
  subtotal = r2(subtotal); descuento = r2(descuento);
  const neto = r2(subtotal - descuento);
  let envio = 0;
  if (entrega === 'delivery' && lineas.some(l => l.tipo === 'producto')) envio = neto >= +emp.envio.gratisDesde ? 0 : +emp.envio.costo;
  return {lineas, subtotal, descuento, envio: r2(envio), total: r2(neto + envio)};
}

async function api(action, body, extra = '') {
  const r = await fetch('api.php?action=' + action + extra, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined, cache: 'no-store'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ('Error ' + r.status));
  return j;
}
async function cargarDB() {
  try {
    if (location.protocol.startsWith('http')) {
      const r = await fetch('api.php?action=load', {cache: 'no-store'});
      const ct = r.headers.get('content-type') || '';
      if (r.ok && ct.includes('json')) {
        const j = await r.json(); MODE = 'api';
        if (j.empresas) return j;
        // Primera instalación: el servidor está vacío → se cargan los datos de ejemplo
        const s = seed(); delete s.adminPin; delete s.pedidos;
        await api('init', {db: s}); return Object.assign(s, {pedidos: []});
      }
    }
  } catch (e) {}
  MODE = 'local';
  return LS.get('wl_db', null) || seed();
}
async function guardarDB() {
  if (MODE === 'api') {
    // Conserva el stock real del servidor (pudo bajar por ventas) salvo en productos cuyo stock editó el admin
    try { const fresh = await api('load'); (fresh.empresas || []).forEach(fe => { const e = DB.empresas.find(x => x.id === fe.id); if (e) fe.productos.forEach(fp => { const p = e.productos.find(x => x.id === fp.id); if (p && p.tipo === 'producto' && !STOCK_EDIT.has(p.id)) p.stock = fp.stock; }); }); } catch (e) {}
    DB.empresas.forEach(sincronizarPagos);
    const copia = Object.assign({}, DB); delete copia.pedidos; delete copia.adminPin;
    await api('save', {pin: ADMIN.pin, db: copia}); STOCK_EDIT.clear();
  }
  else if (DB.empresas.forEach(sincronizarPagos), !LS.set('wl_db', DB)) toast('Aviso: el navegador no permite guardar; los cambios duran hasta recargar.');
}
function elegirEmpresa() {
  const q = new URLSearchParams(location.search).get('e');
  EMP = (q && DB.empresas.find(e => e.slug === q)) || DB.empresas.find(e => e.id === LS.get('wl_emp')) || DB.empresas[0];
  aplicarTema();
}
function aplicarTema() {
  const c = /^#[0-9a-f]{6}$/i.test(EMP.color) ? EMP.color : '#1E3A8A';
  const [r, g, b] = [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
  const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  const s = document.documentElement.style;
  s.setProperty('--brand', c); s.setProperty('--brand-ink', lum > 0.6 ? '#16181d' : '#fff');
  s.setProperty('--brand-soft', `rgba(${r},${g},${b},.13)`);
  $('meta[name=theme-color]').content = c;
  document.title = EMP.nombre + ' – Tienda';
}

/* ---------- carrito ---------- */
const cartKey = () => 'wl_cart_' + EMP.id;
const getCart = () => LS.get(cartKey(), []).filter(it => EMP.productos.some(p => p.id === it.id && p.activo));
const setCart = c => { LS.set(cartKey(), c); pintarContador(); };
const cartCount = () => getCart().reduce((a, b) => a + b.cant, 0);
function pintarContador() { const el = $('.cnt'); if (el) { const n = cartCount(); el.textContent = n; el.hidden = !n; } }
function agregar(id, cant = 1) {
  const p = EMP.productos.find(x => x.id === id); if (!p) return;
  const c = getCart(); const it = c.find(x => x.id === id); const ya = it ? it.cant : 0;
  if (p.tipo === 'producto' && ya + cant > p.stock) { toast(p.stock <= 0 ? 'Producto agotado' : `Solo hay ${p.stock} unidades disponibles`); return false; }
  if (it) it.cant += cant; else c.push({id, cant});
  setCart(c); toast((p.tipo === 'servicio' ? 'Servicio agregado' : 'Agregado') + ' al carrito ✓'); return true;
}

const NOMBRE_RED = {facebook: 'Facebook', instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', x: 'X', linkedin: 'LinkedIn', whatsapp: 'WhatsApp'};
function urlRed(red, v) {
  v = String(v || '').trim(); if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  const h = v.replace(/^@/, '');
  return {facebook: 'https://facebook.com/' + h, instagram: 'https://instagram.com/' + h, tiktok: 'https://www.tiktok.com/@' + h, youtube: 'https://www.youtube.com/@' + h, x: 'https://x.com/' + h, linkedin: 'https://www.linkedin.com/company/' + h}[red];
}
function socialHTML(conWa = true) {
  const items = REDES.map(r => [r, urlRed(r, EMP.redes[r])]).filter(x => x[1]);
  if (conWa && EMP.whatsapp) items.unshift(['whatsapp', waLink('Hola ' + EMP.nombre + ', quisiera más información.')]);
  if (!items.length) return '';
  return `<div class="social">${items.map(([r, u]) => `<a class="s-${r}" href="${esc(u)}" target="_blank" rel="noopener" aria-label="${NOMBRE_RED[r]}" title="${NOMBRE_RED[r]}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[r]}</svg></a>`).join('')}</div>`;
}

function cardProd(p) {
  const pr = promoDe(EMP, p.id), pf = precioFinal(EMP, p), agot = p.tipo === 'producto' && p.stock <= 0;
  return `<div class="card"><a href="#producto-${p.id}" class="thumb">${imgHTML(p)}${pr ? `<span class="badge">-${pr.descuento}%</span>` : ''}${p.tipo === 'servicio' ? '<span class="tag">Servicio</span>' : ''}</a>

  <button class="btn sm full" data-act="add" data-id="${p.id}" ${agot ? 'disabled' : ''}>${agot ? 'Agotado' : p.tipo === 'servicio' ? 'Reservar' : 'Agregar'}</button></div></div>`;
}
function cardPromo(pr) {
  const p = EMP.productos.find(x => x.id === pr.productoId); if (!p) return '';
  const dias = Math.max(0, Math.round((new Date(pr.fin + 'T23:59') - new Date()) / 864e5));
  return `<div class="card promo"><a href="#producto-${p.id}" class="thumb">${imgHTML(p)}</a><div style="flex:1;min-width:0">
  <span class="off">-${pr.descuento}%</span> <span class="small muted">${pr.fin ? (dias === 0 ? 'vence hoy' : `quedan ${dias} días`) : ''}</span>
  <div class="pt">${esc(pr.titulo)}</div><div class="pd">${esc(pr.descripcion || p.nombre)}</div>
  <div class="row between"><div class="price" style="margin:0"><s>${money(p.precio)}</s><b>${money(precioFinal(EMP, p))}</b></div>
  <button class="btn sm" data-act="add" data-id="${p.id}" ${p.tipo === 'producto' && p.stock <= 0 ? 'disabled' : ''}>Agregar</button></div></div></div>`;
}

function validarCheckout(f) {
  const v = Object.fromEntries(new FormData(f).entries());
  const dep = f.dep.value, prov = f.prov.value, dist = f.dist.value;
  const t = calcular(EMP, getCart(), v.entrega || 'servicio');
  const hayServ = t.lineas.some(l => l.tipo === 'servicio');
  const errores = {
    nombre: (v.nombre || '').trim().length < 3,
    telefono: !/^9\d{8}$/.test((v.telefono || '').replace(/\D/g, '')),
    email: v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email),
    dep: !dep, prov: !prov, dist: !dist,
    direccion: (v.direccion || '').trim().length < 5,
    fechaServicio: hayServ && (!v.fechaServicio || v.fechaServicio <= hoy()),
    pago: !v.pago
  };
  let primero = null;
  for (const [k, bad] of Object.entries(errores)) { const el = f.elements[k]; if (el && el.classList) { el.classList.toggle('bad', !!bad); if (bad && !primero) primero = el; } }
  $('#err-ok').style.display = v.acepto ? 'none' : 'block';
  if (primero) { primero.focus(); toast('Revisa los campos marcados'); return null; }
  if (!v.acepto) { toast('Debes aceptar para continuar'); return null; }
  const D = ubDep(dep), P = ubProv(dep, prov), T = P[2].find(x => x[0] === dist);
  return {nombre: v.nombre.trim(), telefono: v.telefono.replace(/\D/g, ''), email: (v.email || '').trim(), entrega: v.entrega || 'servicio', direccion: v.direccion.trim(),
    ubigeo: {codigo: dep + prov + dist, departamento: D[1], provincia: P[1], distrito: T[1]},
    fechaServicio: hayServ ? v.fechaServicio : '', pago: v.pago, nota: (v.nota || '').trim()};
}
async function crearPedido(cliente) {
  const items = getCart();
  let pedido;
  if (MODE === 'api') {
    pedido = (await api('order', {empresaId: EMP.id, items, cliente})).pedido;
    // refrescar stock local
    const fresh = await api('load'); if (fresh.empresas) { DB.empresas = fresh.empresas.map(normalizar); EMP = DB.empresas.find(e => e.id === EMP.id) || EMP; }
  } else {
    const t = calcular(EMP, items, cliente.entrega);
    if (!t.lineas.length) throw new Error('El carrito está vacío');
    for (const l of t.lineas) { const p = EMP.productos.find(x => x.id === l.id); if (p.tipo === 'producto' && p.stock < l.cant) throw new Error(`Stock insuficiente de ${p.nombre} (quedan ${p.stock})`); }
    for (const l of t.lineas) { const p = EMP.productos.find(x => x.id === l.id); if (p.tipo === 'producto') p.stock -= l.cant; }
    const n = DB.pedidos.filter(x => x.empresaId === EMP.id).length + 1;
    pedido = {id: uid(), num: (EMP.codigo || 'PD') + '-' + String(n).padStart(4, '0'), empresaId: EMP.id, fecha: new Date().toISOString(), cliente, ...t, estado: 'Nuevo', historial: [{estado: 'Nuevo', fecha: new Date().toISOString()}]};
    DB.pedidos.unshift(pedido); await guardarDB();
  }
  const mis = LS.get('wl_mis', []); mis.unshift({id: pedido.id, empresaId: EMP.id}); LS.set('wl_mis', mis.slice(0, 50));
  LS.set('wl_cliente', {nombre: cliente.nombre, telefono: cliente.telefono, email: cliente.email, direccion: cliente.direccion, ubigeo: cliente.ubigeo});
  LS.set('wl_ult_' + pedido.id, pedido);
  setCart([]);
  return pedido;
}
function mensajePedido(p) {
  const c = p.cliente, L = [`*Nuevo pedido ${p.num}* – ${EMP.nombre}`, '', `👤 ${c.nombre}`, `📱 ${c.telefono}`];
  if (c.entrega === 'delivery') L.push('🚚 Delivery'); else if (c.entrega === 'recojo') L.push('🏬 Recojo en tienda');
  if (c.direccion) L.push(`📍 ${c.direccion}${c.ubigeo ? ' – ' + ubTxt(c.ubigeo) : ''}`);
  if (c.fechaServicio) L.push(`📅 Servicio: ${fechaTxt(c.fechaServicio)}`);
  L.push(`💳 Pago: ${c.pago}`);
  const m = medioPorNombre(c.pago); if (m && m.tipo !== 'otro') L.push('📎 Enviaré la constancia de pago.');
  L.push('', '*Detalle*');
  p.lineas.forEach(l => L.push(`• ${l.cant} x ${l.nombre} – ${money(l.precioFinal * l.cant)}`));
  L.push('', `Subtotal: ${money(p.subtotal)}`);
  if (p.descuento) L.push(`Descuentos: -${money(p.descuento)}`);
  if (c.entrega === 'delivery') L.push(`Envío: ${p.envio ? money(p.envio) : 'Gratis'}`);
  L.push(`*TOTAL: ${money(p.total)}*`);
  if (c.nota) L.push('', `Nota: ${c.nota}`);
  return L.join('\n');
}

const COLS = [['codigo','Código'],['nombre','Nombre *'],['tipo','Tipo * (producto / servicio)'],['familia','Familia *'],['subfamilia','Subfamilia'],['tipoLente','Tipo de lente'],['tratamientos','Tratamientos (separados por coma)'],['precio','Precio S/ *'],['stock','Stock'],['descripcion','Descripción'],['emoji','Ícono'],['img','Imagen URL (opcional)'],['activo','Visible (SI / NO)']];
const ALIAS = {codigo:'codigo',sku:'codigo',cod:'codigo',nombre:'nombre',producto:'nombre',tipo:'tipo',familia:'familia',categoria:'familia',subfamilia:'subfamilia',tipodelente:'tipoLente',tipolente:'tipoLente',lente:'tipoLente',tratamientos:'tratamientos',tratamiento:'tratamientos',precio:'precio',precios:'precio',stock:'stock',descripcion:'descripcion',icono:'emoji',emoji:'emoji',imagenurl:'img',imagen:'img',foto:'img',visible:'activo',activo:'activo'};
const claveCol = h => ALIAS[norm(h).replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '')] || '';
let XLSX_P = null, IMPORT = null;
function cargarScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('x')); s.onerror = () => { s.remove(); rej(new Error('x')); }; document.head.appendChild(s); }); }
function cargarXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!XLSX_P) XLSX_P = cargarScript('vendor/xlsx.full.min.js').catch(() => cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'))
    .catch(() => { XLSX_P = null; throw new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.'); });
  return XLSX_P;
}
async function leerExcel(file) {
  const X = await cargarXLSX();
  const wb = X.read(await file.arrayBuffer(), {type: 'array'});
  const hoja = wb.SheetNames.find(n => norm(n) === 'productos') || wb.SheetNames[0];
  const filas = X.utils.sheet_to_json(wb.Sheets[hoja], {header: 1, defval: '', raw: true});
  const hi = filas.findIndex((r, i) => i < 15 && r.map(claveCol).includes('nombre') && r.map(claveCol).includes('precio'));
  if (hi < 0) throw new Error('No se encontró la fila de títulos (Nombre, Precio…). Usa la plantilla.');
  const mapa = filas[hi].map(claveCol), items = [], errores = [], vistos = new Set();
  for (let i = hi + 1; i < filas.length; i++) {
    const o = {}; mapa.forEach((k, j) => { if (k) o[k] = filas[i][j]; });
    const tx = k => String(o[k] ?? '').trim();
    if (!tx('nombre') && !tx('codigo') && !tx('precio')) continue;
    const fila = i + 1, errs = [];
    const tipo = /serv/i.test(tx('tipo')) ? 'servicio' : 'producto';
    const precio = typeof o.precio === 'number' ? o.precio : parseFloat(tx('precio').replace(/[^0-9.,-]/g, '').replace(',', '.'));
    const stock = tx('stock') === '' ? 0 : Number(tx('stock'));
    const img = tx('img');
    if (tx('nombre').length < 3) errs.push('nombre vacío o muy corto');
    if (!tx('familia')) errs.push('falta la familia');
    if (!(precio > 0)) errs.push('precio inválido');
    if (tipo === 'producto' && !(Number.isInteger(stock) && stock >= 0)) errs.push('el stock debe ser un número entero');
    if (img && !/^https?:\/\//i.test(img)) errs.push('la imagen debe ser un enlace que empiece con http');
    const cod = tx('codigo');
    if (cod) { if (vistos.has(norm(cod))) errs.push(`código ${cod} repetido`); vistos.add(norm(cod)); }
    if (errs.length) { errores.push(`Fila ${fila}: ${errs.join(', ')}`); continue; }
    items.push({codigo: cod, nombre: tx('nombre'), tipo, familia: tx('familia'), subfamilia: tx('subfamilia'), tipoLente: tx('tipoLente'),
      tratamientos: tratamientosDe({tratamientos: tx('tratamientos')}).join(', '), precio: r2(precio), stock: tipo === 'producto' ? stock : null,
      descripcion: tx('descripcion'), emoji: tx('emoji'), img, activo: !/^(no|0|false|falso|n)$/i.test(tx('activo'))});
  }
  IMPORT = {items, errores, archivo: file.name};
  modalImport('actualizar');

function planImport(modo) {
  const actuales = EMP.productos, usados = new Set();
  const buscar = it => actuales.find(p => it.codigo ? norm(p.codigo) === norm(it.codigo) : norm(p.nombre) === norm(it.nombre));
  const lista = modo === 'reemplazar' ? [] : actuales.map(p => ({...p}));
  let nuevos = 0, actualizados = 0;
  IMPORT.items.forEach((it, i) => {
    const ex = buscar(it), d = {...it};
    if (!d.img && ex) d.img = ex.img;
    if (!d.emoji) d.emoji = ex?.emoji || (d.tipo === 'servicio' ? '🛠️' : '📦');
    if (ex && !usados.has(ex.id)) {
      actualizados++; usados.add(ex.id);
      const p = {...ex, ...d, id: ex.id, codigo: d.codigo || ex.codigo, categoria: d.familia};
      if (modo === 'reemplazar') lista.push(p); else lista[lista.findIndex(x => x.id === ex.id)] = p;
    } else { nuevos++; lista.push({...d, id: 'p' + uid() + i, categoria: d.familia}); }
  });
  const codigos = new Set(lista.map(p => norm(p.codigo)).filter(Boolean));
  let n = 1; lista.forEach(p => { if (!p.codigo) { let c; do { c = (EMP.codigo || 'PR') + '-' + String(n++).padStart(3, '0'); } while (codigos.has(norm(c))); p.codigo = c; codigos.add(norm(c)); } });
  const ids = new Set(lista.map(p => p.id));
  return {lista, nuevos, actualizados, eliminados: modo === 'reemplazar' ? actuales.filter(p => !usados.has(p.id)).length : 0, total: lista.length, promosPerdidas: EMP.promos.filter(pr => !ids.has(pr.productoId)).length};
}

function leerImagen(file, max) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type)) return rej(new Error('Archivo no es una imagen'));
    if (file.size > 8e6) return rej(new Error('La imagen supera 8 MB'));
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', .82)); }; im.onerror = () => rej(new Error('No se pudo leer la imagen')); im.src = fr.result; };
    fr.onerror = () => rej(new Error('No se pudo leer el archivo')); fr.readAsDataURL(file);
  });
}

  },
  empresa(el) { EMP = DB.empresas.find(e => e.id === el.value); LS.set('wl_emp', EMP.id); aplicarTema(); render(); },
  async logo(el) { try { EMP.logo = await leerImagen(el.files[0], 256); await guardarSeguro('Logo actualizado ✓'); render(); } catch (e) { toast(e.message); } },
  async prodImg(el) { try { TMP_IMG = await leerImagen(el.files[0], 600); $('#pimg').innerHTML = `<img src="${TMP_IMG}" alt="">`; } catch (e) { toast(e.message); } }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { if (b.tagName === 'BUTTON') e.preventDefault(); ACT[b.dataset.act](b, e); } });
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; FORMS[f.dataset.form]?.(f); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el); if (el.name === 'entrega') pintarTotales(); if (el.name === 'pago') pintarPagoInfo(); if (el.classList.contains('bad')) el.classList.remove('bad'); });
document.addEventListener('input', e => { if (e.target.id === 'q') { UI.q = e.target.value; pintarGrid(); } if (e.target.id === 'qs') pintarQS(); });
document.addEventListener('keydown', e => { if (e.target.id === 'qs' && e.key === 'Enter') { e.preventDefault(); ACT.qsVerTodo(); } });
function pintarQS() {
  const box = $('#qsr'); if (!box) return;
  const raw = $('#qs')?.value || '', q = norm(raw).trim();
  if (!q) { box.innerHTML = `<div class="small muted" style="margin:14px 2px 8px">Búsquedas sugeridas</div><div class="tags">${[...familias(), ...tiposLente(), ...tratamientosTodos()].slice(0, 12).map(t => `<button class="chip" data-act="qsTag" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`; return; }
  const l = productosVisibles().filter(p => coincide(p, q));
  box.innerHTML = l.length ? l.slice(0, 12).map(p => `<a class="adm-item" href="#producto-${p.id}"><div class="thumb">${imgHTML(p)}</div><div class="grow"><div class="t">${esc(p.nombre)}</div><div class="small muted">${famTxt(p)}</div></div><b class="small" style="color:var(--brand)">${money(precioFinal(EMP, p))}</b></a>`).join('')
    + `<button class="btn ghost full" style="margin-top:10px" data-act="qsVerTodo">Ver ${l.length} resultado(s) en el catálogo</button>` : `<div class="empty" style="padding:24px">Sin resultados para "${esc(raw)}"</div>`;
}

/* ---------- router ---------- */
async function render() {
  const h = (location.hash || '#inicio').slice(1);
  const i = h.indexOf('-'), v = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : h.slice(i + 1);
  const app = $('#app');
  let html;
  switch (v) {
    case 'catalogo': html = vCatalogo(); break;
    case 'promos': html = vPromos(); break;
    case 'producto': html = vProducto(arg); break;
    case 'carrito': html = vCarrito(); break;
    case 'checkout': html = vCheckout(); break;
    case 'ok': html = vPedidoOk(arg); break;
    case 'pedidos': html = await vPedidos(); break;
    case 'contacto': html = vContacto(); break;
    case 'admin': html = vAdmin(); break;
    default: html = vInicio();
  }
  if (html) app.innerHTML = html;
  if (v === 'catalogo') pintarGrid();
  if (v === 'checkout') { pintarTotales(); pintarPagoInfo(); }
}
let ultimaVista = '';
window.addEventListener('hashchange', () => { modal(''); render().then(() => { const v = location.hash; if (v !== ultimaVista) window.scrollTo(0, 0); ultimaVista = v; }); });

(async function init() {
  DB = await cargarDB();
  if (!DB.pedidos) DB.pedidos = [];
  DB.empresas.forEach(normalizar);
  elegirEmpresa();
  await render();
  if (MODE === 'api' && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
})();
</script>
</body>
